name: Збірка APK Тиць

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Завантажити код
        uses: actions/checkout@v4

      - name: Встановити Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''

      - name: Встановити Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Встановити Capacitor
        run: |
          npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Підготувати вебзастосунок
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html

      - name: Створити конфігурацію Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.tyts.app",
            "appName": "Тиць",
            "webDir": "www"
          }
          EOF

      - name: Створити Android-проєкт
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: Зібрати APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Перевірити APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Створити реліз з APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          
          gh release create "$TAG" \
            "android/app/build/outputs/apk/debug/app-debug.apk" \
            --title "Тиць APK $TAG" \
            --notes "Готовий APK застосунку Тиць."

      - name: Зберегти APK як резервну копію
        uses: actions/upload-artifact@v4
        with:
          name: tyts-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
