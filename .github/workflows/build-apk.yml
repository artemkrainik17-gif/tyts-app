name: Збірка APK Тиць

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Завантажити код
        uses: actions/checkout@v4

      - name: Встановити Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''

      - name: Встановити Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Перевірити Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT/platforms" || true
          ls -la "$ANDROID_SDK_ROOT/build-tools" || true

      - name: Встановити Capacitor
        run: |
          npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Підготувати вебзастосунок
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html

      - name: Створити конфігурацію Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.tyts.app",
            "appName": "Тиць",
            "webDir": "www"
          }
          EOF

      - name: Створити Android-проєкт
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: Зібрати APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Зберегти APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tyts-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
