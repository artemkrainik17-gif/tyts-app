name: Збірка APK Тиць

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Завантажити код
        uses: actions/checkout@v4

      - name: Встановити Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''

      - name: Встановити Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Перевірити Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT"

      - name: Встановити Capacitor
        run: |
          npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Встановити генератор іконки
        run: |
          npm install --no-save @capacitor/assets

      - name: Підготувати вебзастосунок
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html

      - name: Підготувати іконку Тиць
        run: |
          rm -rf assets
          mkdir -p assets
          cp a_clean_modern_flat_soft_3d_app_icon_logo_imag.png assets/icon.png

      - name: Створити конфігурацію Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.tyts.app",
            "appName": "Тиць",
            "webDir": "www"
          }
          EOF

      - name: Створити Android-проєкт
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: Створити Android-іконки
        run: |
          npx @capacitor/assets generate --android --assetPath assets --androidProject android

      - name: Зібрати APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Перевірити APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Зберегти APK як артефакт
        uses: actions/upload-artifact@v4
        with:
          name: tyts-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Створити GitHub Release з APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: tyts-latest
          name: Тиць — остання версія
          body: |
            Остання збірка застосунку «Тиць».

            APK готовий для встановлення на Android.
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
