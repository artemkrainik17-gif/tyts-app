name: Збірка APK Тиць

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Завантажити код
        uses: actions/checkout@v4

      - name: Встановити Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Встановити Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Встановити Capacitor
        run: |
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Створити Android-проєкт
        run: |
          npx cap add android
          npx cap copy android

      - name: Зібрати APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Зберегти APK
        uses: actions/upload-artifact@v4
        with:
          name: tyts-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
