
name: Новости TYTS ежечасно

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 googlenewsdecoder "selectolax<1.0"

      - name: Update news
        run: python update_news.py

      - name: Commit updated news feed
        run: |
          if [ -f news.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news.json

            if ! git diff --cached --quiet; then
              git commit -m "Оновлення новин TYTS"
              git push
            else
              echo "Нових змін у news.json немає"
            fi
          else
            echo "Помилка: news.json не створено"
            exit 1
          fi
